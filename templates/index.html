<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wine Quality Prediction</title>

  <style>
    :root{
      --bg: #0b1220;
      --card: rgba(255,255,255,0.10);
      --card-border: rgba(255,255,255,0.18);
      --text: #eaf0ff;
      --muted: rgba(234,240,255,0.75);
      --focus: rgba(99, 179, 237, 0.55);
      --accent: #63b3ed;
      --danger: #ff6b6b;
    }

    * { box-sizing: border-box; }
    body{
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
    }

    /* Background */
    .hero{
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background:
        linear-gradient(180deg, rgba(11,18,32,0.85), rgba(11,18,32,0.92)),
        url("static/assets/img/form-v9.jpg");
      background-size: cover;
      background-position: center;
    }

    .card{
      width: min(980px, 100%);
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      overflow: hidden;
    }

    .card-header{
      padding: 22px 22px 0 22px;
    }

    .title{
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: 0.2px;
    }

    .subtitle{
      margin: 8px 0 0 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.4;
    }

    form{
      padding: 18px 22px 22px 22px;
    }

    .grid{
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px 16px;
      margin-top: 14px;
    }

    @media (max-width: 720px){
      .grid{ grid-template-columns: 1fr; }
    }

    .field label{
      display: inline-block;
      margin-bottom: 6px;
      font-size: 0.92rem;
      color: var(--muted);
    }

    .field input{
      width: 100%;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.20);
      color: var(--text);
      outline: none;
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }

    .field input::placeholder{
      color: rgba(234,240,255,0.45);
    }

    .field input:focus{
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--focus);
    }

    .hint{
      margin-top: 6px;
      font-size: 0.82rem;
      color: rgba(234,240,255,0.55);
    }

    .actions{
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.14);
    }

    .btn{
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      font-weight: 650;
      cursor: pointer;
      transition: transform 80ms ease, opacity 120ms ease;
    }

    .btn:active{ transform: translateY(1px); }

    .btn-primary{
      background: var(--accent);
      color: #07101f;
    }

    .btn-secondary{
      background: rgba(255,255,255,0.12);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.18);
    }

    .note{
      margin-top: 10px;
      color: rgba(234,240,255,0.6);
      font-size: 0.85rem;
    }

    /* Optional: basic invalid feedback without JS */
    input:invalid{
      border-color: rgba(255,107,107,0.45);
    }
  </style>
</head>

<body>
  <main class="hero">
    <section class="card" aria-label="Wine quality prediction form">
      <header class="card-header">
        <h1 class="title">Wine Quality Prediction</h1>
        <p class="subtitle">
          Enter the chemical properties below (numbers only). Then click <b>Predict</b>.
        </p>
      </header>

      <form action="/predict" method="post" autocomplete="off" novalidate>
        <div class="grid">
          <div class="field">
            <label for="fixed_acidity">Fixed Acidity</label>
            <input type="number" step="any" inputmode="decimal" name="fixed_acidity" id="fixed_acidity" placeholder="e.g., 7.4" required>
          </div>

          <div class="field">
            <label for="volatile_acidity">Volatile Acidity</label>
            <input type="number" step="any" inputmode="decimal" name="volatile_acidity" id="volatile_acidity" placeholder="e.g., 0.70" required>
          </div>

          <div class="field">
            <label for="citric_acid">Citric Acid</label>
            <input type="number" step="any" inputmode="decimal" name="citric_acid" id="citric_acid" placeholder="e.g., 0.00" required>
          </div>

          <div class="field">
            <label for="residual_sugar">Residual Sugar</label>
            <input type="number" step="any" inputmode="decimal" name="residual_sugar" id="residual_sugar" placeholder="e.g., 1.9" required>
          </div>

          <div class="field">
            <label for="chlorides">Chlorides</label>
            <input type="number" step="any" inputmode="decimal" name="chlorides" id="chlorides" placeholder="e.g., 0.076" required>
          </div>

          <div class="field">
            <label for="free_sulfur_dioxide">Free Sulfur Dioxide</label>
            <input type="number" step="any" inputmode="decimal" name="free_sulfur_dioxide" id="free_sulfur_dioxide" placeholder="e.g., 11" required>
          </div>

          <div class="field">
            <label for="total_sulfur_dioxide">Total Sulfur Dioxide</label>
            <input type="number" step="any" inputmode="decimal" name="total_sulfur_dioxide" id="total_sulfur_dioxide" placeholder="e.g., 34" required>
          </div>

          <div class="field">
            <label for="density">Density</label>
            <input type="number" step="any" inputmode="decimal" name="density" id="density" placeholder="e.g., 0.9978" required>
          </div>

          <div class="field">
            <label for="pH">pH</label>
            <input type="number" step="any" inputmode="decimal" name="pH" id="pH" placeholder="e.g., 3.51" required>
          </div>

          <div class="field">
            <label for="sulphates">Sulphates</label>
            <input type="number" step="any" inputmode="decimal" name="sulphates" id="sulphates" placeholder="e.g., 0.56" required>
          </div>

          <div class="field" style="grid-column: 1 / -1;">
            <label for="alcohol">Alcohol</label>
            <input type="number" step="any" inputmode="decimal" name="alcohol" id="alcohol" placeholder="e.g., 9.4" required>
            <div class="hint">Tip: use decimals where needed (e.g., 0.56, 9.4).</div>
          </div>
        </div>

        <div class="actions">
          <button class="btn btn-secondary" type="reset">Clear</button>
          <button class="btn btn-primary" type="submit">Predict</button>
        </div>

        <div class="note">
          If you still want Bootstrap spacing like <code>container px-4 px-lg-5</code>, you can wrap this card in your Bootstrap container.
        </div>
      </form>
    </section>
  </main>
</body>
</html>
